    <ellipse cx="369" cy="532" rx="46" ry="61" fill="#4A1B0C"/>
    <ellipse cx="655" cy="532" rx="46" ry="61" fill="#4A1B0C"/>
    <circle cx="276" cy="655" r="61" fill="#ED93B1" opacity=".8"/>
    <circle cx="748" cy="655" r="61" fill="#ED93B1" opacity=".8"/>
    <path d="M451 665 Q512 727 573 665" stroke="#4A1B0C" stroke-width="27" fill="none" stroke-linecap="round"/>
